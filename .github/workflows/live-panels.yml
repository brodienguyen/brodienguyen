name: Live panels

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MISE_RUBY_COMPILE: "false"
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install the pinned Ruby
        uses: jdx/mise-action@v5.2.0

      - name: Draw the irb session, upstream timeline and contribution city
        run: mise run live
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: live
        env:
          GITHUB_TOKEN: ${{ github.token }}
