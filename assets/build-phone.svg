pacity="0.07" stroke="#4cc9f0" style="animation-delay: 2.2s; animation-duration: 5.5s"/><rect x="16" y="196" width="3" height="68" fill="#4cc9f0"/><text x="32" y="216" class="eyebrow">INTEGRATIONS</text><text x="32" y="234" class="mono" font-size="11" fill="#8aa0b4">delivery, loyalty and BNPL partner APIs in</text><text x="32" y="251" class="mono" font-size="11" fill="#8aa0b4">production</text><rect x="16" y="272" width="336" height="51" rx="3" fill="#0f1e2e" stroke="#4cc9f0" stroke-opacity="0.35"/><rect class="lit" x="16" y="272" width="336" height="51" rx="3" fill="#4cc9f0" fill-opacity="0.07" stroke="#4cc9f0" style="animation-delay: 3.3s; animation-duration: 5.5s"/><rect x="16" y="272" width="3" height="51" fill="#4cc9f0"/><text x="32" y="292" class="eyebrow">IDENTITY</text><text x="32" y="310" class="mono" font-size="11" fill="#8aa0b4">passkeys · SSO · ACLs · tenant isolation</text><rect x="16" y="331" width="336" height="68" rx="3" fill="#0f1e2e" stroke="#4cc9f0" stroke-opacity="0.35"/><rect class="lit" x="16" y="331" width="336" height="68" rx="3" fill="#4cc9f0" fill-opacity="0.07" stroke="#4cc9f0" style="animation-delay: 4.4s; animation-duration: 5.5s"/><rect x="16" y="331" width="3" height="68" fill="#4cc9f0"/><text x="32" y="351" class="eyebrow">INFRASTRUCTURE + DEVOPS</text><text x="32" y="369" class="mono" font-size="11" fill="#8aa0b4">Proxmox HA cluster · Docker Swarm · NixOS ·</text><text x="32" y="386" class="mono" font-size="11" fill="#8aa0b4">OpenTofu</text><rect x="16" y="411" width="336" height="235" rx="3" fill="none" stroke="#4ade80" stroke-opacity="0.8" stroke-dasharray="4 3"/><text x="32" y="431" class="label">DEVELOPER EXPERIENCE</text><text x="32" y="449" class="mono" font-size="11" fill="#4ade80">Bottlenecks I removed, and how.</text><text x="32" y="474" class="mono" font-size="10" fill="#8aa0b4">microservices tax on a small team</text><text x="32" y="490" class="mono" font-size="11" fill="#e6eef6">→ Packwerk modular monolith</text><text x="32" y="510" class="mono" font-size="10" fill="#8aa0b4">full CI suite on every push</text><text x="32" y="526" class="mono" font-size="11" fill="#e6eef6">→ test selection + cached results</text><text x="32" y="546" class="mono" font-size="10" fill="#8aa0b4">agents can read secrets</text><text x="32" y="562" class="mono" font-size="11" fill="#e6eef6">→ hooks deny agent secret reads</text><text x="32" y="582" class="mono" font-size="10" fill="#8aa0b4">parallel agents collide</text><text x="32" y="598" class="mono" font-size="11" fill="#e6eef6">→ isolated worktree per agent</text><text x="32" y="618" class="mono" font-size="10" fill="#8aa0b4">agents can’t drive dashboards</text><text x="32" y="634" class="mono" font-size="11" fill="#e6eef6">→ CLI-first ops, plan then apply</text><text x="16" y="676" class="label">ONE ENGINEER, EVERY LAYER</text></g>
