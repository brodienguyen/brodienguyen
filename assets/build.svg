<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-label="What I build, end to end: Experience: design system · Inertia + Svelte · Capacitor iOS and Android. Product: multi-tenant Rails SaaS · per-tenant custom domains. Integrations: delivery, loyalty and BNPL partner APIs in production. Identity: passkeys · SSO · ACLs · tenant isolation. Infrastructure + devops: Proxmox HA cluster · Docker Swarm · NixOS · OpenTofu. Developer experience: Bottlenecks I removed, and how..">
