elay: 2.2s; animation-duration: 5.5s"/><rect x="24" y="170" width="3" height="51" fill="#4cc9f0"/><text x="40" y="190" class="eyebrow">INTEGRATIONS</text><text x="40" y="208" class="mono" font-size="12" fill="#8aa0b4">delivery, loyalty and BNPL partner APIs in production</text><rect x="24" y="229" width="474" height="51" rx="3" fill="#0f1e2e" stroke="#4cc9f0" stroke-opacity="0.35"/><rect class="lit" x="24" y="229" width="474" height="51" rx="3" fill="#4cc9f0" fill-opacity="0.07" stroke="#4cc9f0" style="animation-delay: 3.3s; animation-duration: 5.5s"/><rect x="24" y="229" width="3" height="51" fill="#4cc9f0"/><text x="40" y="249" class="eyebrow">IDENTITY</text><text x="40" y="267" class="mono" font-size="12" fill="#8aa0b4">passkeys · SSO · ACLs · tenant isolation</text><rect x="24" y="288" width="474" height="51" rx="3" fill="#0f1e2e" stroke="#4cc9f0" stroke-opacity="0.35"/><rect class="lit" x="24" y="288" width="474" height="51" rx="3" fill="#4cc9f0" fill-opacity="0.07" stroke="#4cc9f0" style="animation-delay: 4.4s; animation-duration: 5.5s"/><rect x="24" y="288" width="3" height="51" fill="#4cc9f0"/><text x="40" y="308" class="eyebrow">INFRASTRUCTURE + DEVOPS</text><text x="40" y="326" class="mono" font-size="12" fill="#8aa0b4">Proxmox HA cluster · Docker Swarm · NixOS · OpenTofu</text><rect x="510" y="52" width="282" height="287" rx="3" fill="none" stroke="#4ade80" stroke-opacity="0.8" stroke-dasharray="4 3"/><text x="526" y="74" class="label">DEVELOPER EXPERIENCE</text><text x="526" y="98" class="mono" font-size="12" fill="#4ade80">Bottlenecks I removed, and how.</text><text x="526" y="126" class="mono" font-size="11" fill="#8aa0b4">microservices tax on a small team</text><text x="526" y="142" class="mono" font-size="12" fill="#e6eef6">→ Packwerk modular monolith</text><text x="526" y="167" class="mono" font-size="11" fill="#8aa0b4">full CI suite on every push</text><text x="526" y="183" class="mono" font-size="12" fill="#e6eef6">→ test selection + cached results</text><text x="526" y="208" class="mono" font-size="11" fill="#8aa0b4">agents can read secrets</text><text x="526" y="224" class="mono" font-size="12" fill="#e6eef6">→ hooks deny agent secret reads</text><text x="526" y="249" class="mono" font-size="11" fill="#8aa0b4">parallel agents collide</text><text x="526" y="265" class="mono" font-size="12" fill="#e6eef6">→ isolated worktree per agent</text><text x="526" y="290" class="mono" font-size="11" fill="#8aa0b4">agents can’t drive dashboards</text><text x="526" y="306" class="mono" font-size="12" fill="#e6eef6">→ CLI-first ops, plan then apply</text><line x1="508" y1="77.5" x2="501" y2="77.5" stroke="#4cc9f0" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="508" y1="136.5" x2="501" y2="136.5" stroke="#4cc9f0" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="508" y1="195.5" x2="501" y2="195.5" stroke="#4cc9f0" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="508" y1="254.5" x2="501" y2="254.5" stroke="#4cc9f0" stroke-width="1.5" marker-end="url(#arrow)"/><line x1="508" y1="313.5" x2="501" y2="313.5" stroke="#4cc9f0" stroke-width="1.5" marker-end="url(#arrow)"/><text x="24" y="369" class="label">ONE ENGINEER, EVERY LAYER</text></g>
