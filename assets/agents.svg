<svg xmlns="http://www.w3.org/2000/svg" width="880" height="384" viewBox="0 0 880 384" role="img" aria-label="Agentic engineering: I make AI agents safe to ship with. Three agents work in parallel on a new feature, a bug fix and a clean-up, inside guardrails of hooks, skills and lint rules; nothing ships without human sign-off.">
  <defs>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="translate(0 0)"><path d="M16 0H0V16" fill="none" stroke="#4cc9f0" stroke-opacity="0.07"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4cc9f0"/></marker>
  </defs>
  <style>
    .sans { font-family: 'Space Grotesk', 'Inter', ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .label { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.14em; fill: #8aa0b4; }
    .eyebrow { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; fill: #4cc9f0; }
    .commit { animation: commit 4.4s linear infinite; }
.beat { animation: beat 1.1s ease-in-out infinite; }
.rail { animation: rail 1.6s linear infinite; }
@keyframes rail { to { stroke-dashoffset: -20; } }
@keyframes commit {
  0% { transform: translateX(0); opacity: 0; }
  8% { opacity: 1; }
  92% { opacity: 1; }
  100% { transform: translateX(var(--len)); opacity: 0; }
}
@keyframes beat { 50% { opacity: 0.25; } }
@media (prefers-reduced-motion: reduce) { .commit, .beat, .rail { animation: none; } }

  </style>
  <path d="M0 0H880V384H0Z" fill="#0b1622"/>
  <path d="M0 0H880V384H0Z" fill="url(#grid)"/>
  <g transform="translate(32 0)"><rect x="0.5" y="0.5" width="815" height="365" fill="#0f1e2e" stroke="#4cc9f0" stroke-opacity="0.22"/><path d="M0.75 10.75V0.75H10.75" fill="none" stroke="#4cc9f0" stroke-opacity="0.65" stroke-width="1.5"/><path d="M805.25 0.75H815.25V10.75" fill="none" stroke="#4cc9f0" stroke-opacity="0.65" stroke-width="1.5"/><path d="M0.75 355.25V365.25H10.75" fill="none" stroke="#4cc9f0" stroke-opacity="0.65" stroke-width="1.5"/><path d="M805.25 365.25H815.25V355.25" fill="none" stroke="#4cc9f0" stroke-opacity="0.65" stroke-width="1.5"/><text x="24" y="54" class="sans" font-size="26" fill="#e6eef6" font-weight="700">I make AI agents safe to ship with.</text><text x="24" y="82" class="mono" font-size="12.5" fill="#8aa0b4">Guardrails that let agents do real work without breaking things, whichever agent comes next.</text><rect x="24" y="163.0" width="140" height="50" rx="3" fill="#0f1e2e" stroke="#4cc9f0" stroke-opacity="0.4"/><text x="36" y="183.0" class="label">TASK</text><text x="36" y="201.0" class="mono" font-size="11.5" fill="#8aa0b4">an idea or a bug</text><rect x="468" y="163.0" width="184" height="50" rx="3" fill="#0f1e2e" stroke="#4cc9f0" stroke-opacity="0.9"/><text x="480" y="183.0" class="eyebrow">QUALITY GATE</text><text x="480" y="201.0" class="mono" font-size="11.5" fill="#8aa0b4">human sign-off, taste</text><rect x="680" y="163.0" width="112" height="50" rx="3" fill="#0f1e2e" stroke="#4cc9f0" stroke-opacity="0.4"/><text x="692" y="183.0" class="label">LIVE</text><text x="692" y="201.0" class="mono" font-size="11.5" fill="#8aa0b4">shipped</text><line x1="654" y1="188.0" x2="678" y2="188.0" stroke="#4cc9f0" stroke-width="1.5" marker-end="url(#arrow)"/><circle class="beat" cx="638" cy="179.0" r="4" fill="#4ade80"/><path d="M164 188.0C180 188.0 188 144 204 144" fill="none" stroke="#4cc9f0" stroke-opacity="0.45"/><path d="M428 144C444 144 452 188.0 468 188.0" fill="none" stroke="#4cc9f0" stroke-opacity="0.45"/><text x="204" y="135" class="label">AGENT 1 · NEW FEATURE</text><line x1="204" y1="144" x2="428" y2="144" stroke="#4cc9f0" stroke-opacity="0.35" stroke-dasharray="2 4"/><rect class="commit" x="199" y="139" width="10" height="10" rx="2" fill="#4cc9f0" style="--len: 224px; animation-delay: -0.0s"/><rect class="commit" x="199" y="139" width="10" height="10" rx="2" fill="#4cc9f0" style="--len: 224px; animation-delay: -2.2s"/><path d="M164 188.0C180 188.0 188 188 204 188" fill="none" stroke="#4cc9f0" stroke-opacity="0.45"/><path d="M428 188C444 188 452 188.0 468 188.0" fill="none" stroke="#4cc9f0" stroke-opacity="0.45"/><text x="204" y="179" class="label">AGENT 2 · BUG FIX</text><line x1="204" y1="188" x2="428" y2="188" stroke="#4cc9f0" stroke-opacity="0.35" stroke-dasharray="2 4"/><rect class="commit" x="199" y="183" width="10" height="10" rx="2" fill="#4cc9f0" style="--len: 224px; animation-delay: -1.3s"/><rect class="commit" x="199" y="183" width="10" height="10" rx="2" fill="#4cc9f0" style="--len: 224px; animation-delay: -3.5s"/><path d="M164 188.0C180 188.0 188 232 204 232" fill="none" stroke="#4cc9f0" stroke-opacity="0.45"/><path d="M428 232C444 232 452 188.0 468 188.0" fill="none" stroke="#4cc9f0" stroke-opacity="0.45"/><text x="204" y="223" class="label">AGENT 3 · CLEAN-UP</text><line x1="204" y1="232" x2="428" y2="232" stroke="#4cc9f0" stroke-opacity="0.35" stroke-dasharray="2 4"/><rect class="commit" x="199" y="227" width="10" height="10" rx="2" fill="#4cc9f0" style="--len: 224px; animation-delay: -2.6s"/><rect class="commit" x="199" y="227" width="10" height="10" rx="2" fill="#4cc9f0" style="--len: 224px; animation-delay: -4.8s"/><rect class="rail" x="190" y="114" width="252" height="136" rx="6" fill="#4ade80" fill-opacity="0.04" stroke="#4ade80" stroke-opacity="0.85" stroke-dasharray="6 4"/><rect x="365.0" y="107" width="73.0" height="14" fill="#0f1e2e"/><text x="432" y="118" class="mono" font-size="10" fill="#4ade80" text-anchor="end">GUARDRAILS</text><rect x="24" y="272" width="216.4" height="24" rx="3" fill="#0f1e2e" stroke="#4ade80" stroke-opacity="0.8"/><text x="34" y="288.1" class="mono" font-size="11.5" fill="#4ade80">ONE RULEBOOK FOR EVERY AGENT</text><rect x="248.4" y="272" width="237.5" height="24" rx="3" fill="#0f1e2e" stroke="#4ade80" stroke-opacity="0.8"/><text x="258.4" y="288.1" class="mono" font-size="11.5" fill="#4ade80">HOOKS THAT BLOCK RISKY COMMANDS</text><rect x="493.9" y="272" width="237.5" height="24" rx="3" fill="#0f1e2e" stroke="#4ade80" stroke-opacity="0.8"/><text x="503.9" y="288.1" class="mono" font-size="11.5" fill="#4ade80">CUSTOM LINT RULES AS GUARDRAILS</text><rect x="24" y="302" width="258.5" height="24" rx="3" fill="#0f1e2e" stroke="#4ade80" stroke-opacity="0.8"/><text x="34" y="318.1" class="mono" font-size="11.5" fill="#4ade80">PROJECT SKILLS AND REVIEWER AGENTS</text><text x="24" y="348" class="label">FIG. 02 · AGENTS WORKING INSIDE GUARDRAILS</text></g>
</svg>
