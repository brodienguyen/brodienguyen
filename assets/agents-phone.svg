<svg xmlns="http://www.w3.org/2000/svg" width="400" height="592" viewBox="0 0 400 592" role="img" aria-label="Agentic engineering: I make AI agents safe to ship with. Three agents work in parallel on a new feature, a bug fix and a clean-up, inside guardrails of hooks, skills and lint rules; nothing ships without human sign-off.">
  <defs>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="translate(0 0)"><path d="M16 0H0V16" fill="none" stroke="#4cc9f0" stroke-opacity="0.07"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4cc9f0"/></marker>
  </defs>
  <style>
    .sans { font-family: 'Space Grotesk', 'Inter', ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .label { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.14em; fill: #8aa0b4; }
    .eyebrow { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.14em; fill: #4cc9f0; }
    .commit { animation: commit 4.4s linear infinite; }
.beat { animation: beat 1.1s ease-in-out infinite; }
.rail { animation: rail 1.6s linear infinite; }
@keyframes rail { to { stroke-dashoffset: -20; } }
@keyframes commit {
  0% { transform: translateX(0); opacity: 0; }
  8% { opacity: 1; }
  92% { opacity: 1; }
  100% { transform: translateX(var(--len)); opacity: 0; }
}
@keyframes beat { 50% { opacity: 0.25; } }
@media (prefers-reduced-motion: reduce) { .commit, .beat, .rail { animation: none; } }

  </style>
  <path d="M0 0H400V592H0Z" fill="#0b1622"/>
  <path d="M0 0H400V592H0Z" fill="url(#grid)"/>
  <g transform="translate(16 0)"><rect x="0.5" y="0.5" width="367" height="579" fill="#0f1e2e" stroke="#4cc9f0" stroke-opacity="0.22"/><path d="M0.75 10.75V0.75H10.75" fill="none" stroke="#4cc9f0" stroke-opacity="0.65" stroke-width="1.5"/><path d="M357.25 0.75H367.25V10.75" fill="none" stroke="#4cc9f0" stroke-opacity="0.65" stroke-width="1.5"/><path d="M0.75 569.25V579.25H10.75" fill="none" stroke="#4cc9f0" stroke-opacity="0.65" stroke-width="1.5"/><path d="M357.25 579.25H367.25V569.25" fill="none" stroke="#4cc9f0" stroke-opacity="0.65" stroke-width="1.5"/><text x="16" y="46" class="sans" font-size="20" fill="#e6eef6" font-weight="700">I make AI agents</text><text x="16" y="72" class="sans" font-size="20" fill="#e6eef6" font-weight="700">safe to ship with.</text><text x="16" y="94" class="mono" font-size="11" fill="#8aa0b4">Guardrails that let agents do real work without</text><text x="16" y="112" class="mono" font-size="11" fill="#8aa0b4">breaking things, whichever agent comes next.</text><rect x="16" y="138" width="336" height="50" rx="3" fill="#0f1e2e" stroke="#4cc9f0" stroke-opacity="0.4"/><text x="28" y="158" class="label">TASK</text><text x="28" y="176" class="mono" font-size="11.5" fill="#8aa0b4">an idea or a bug</text><line x1="184.0" y1="190" x2="184.0" y2="206" stroke="#4cc9f0" stroke-width="1.5" marker-end="url(#arrow)"/><text x="30" y="235" class="label">AGENT 1 · NEW FEATURE</text><line x1="30" y1="244" x2="338" y2="244" stroke="#4cc9f0" stroke-opacity="0.35" stroke-dasharray="2 4"/><rect class="commit" x="25" y="239" width="10" height="10" rx="2" fill="#4cc9f0" style="--len: 308px; animation-delay: -0.0s"/><rect class="commit" x="25" y="239" width="10" height="10" rx="2" fill="#4cc9f0" style="--len: 308px; animation-delay: -2.2s"/><text x="30" y="275" class="label">AGENT 2 · BUG FIX</text><line x1="30" y1="284" x2="338" y2="284" stroke="#4cc9f0" stroke-opacity="0.35" stroke-dasharray="2 4"/><rect class="commit" x="25" y="279" width="10" height="10" rx="2" fill="#4cc9f0" style="--len: 308px; animation-delay: -1.3s"/><rect class="commit" x="25" y="279" width="10" height="10" rx="2" fill="#4cc9f0" style="--len: 308px; animation-delay: -3.5s"/><text x="30" y="315" class="label">AGENT 3 · CLEAN-UP</text><line x1="30" y1="324" x2="338" y2="324" stroke="#4cc9f0" stroke-opacity="0.35" stroke-dasharray="2 4"/><rect class="commit" x="25" y="319" width="10" height="10" rx="2" fill="#4cc9f0" style="--len: 308px; animation-delay: -2.6s"/><rect class="commit" x="25" y="319" width="10" height="10" rx="2" fill="#4cc9f0" style="--len: 308px; animation-delay: -4.8s"/><rect class="rail" x="16" y="214" width="336" height="128" rx="6" fill="#4ade80" fill-opacity="0.04" stroke="#4ade80" stroke-opacity="0.85" stroke-dasharray="6 4"/><rect x="275.0" y="207" width="73.0" height="14" fill="#0f1e2e"/><text x="342" y="218" class="mono" font-size="10" fill="#4ade80" text-anchor="end">GUARDRAILS</text><line x1="184.0" y1="344" x2="184.0" y2="360" stroke="#4cc9f0" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="16" y="366" width="162.0" height="50" rx="3" fill="#0f1e2e" stroke="#4cc9f0" stroke-opacity="0.9"/><text x="28" y="386" class="eyebrow">QUALITY GATE</text><text x="28" y="404" class="mono" font-size="11.5" fill="#8aa0b4">human sign-off</text><rect x="190.0" y="366" width="162.0" height="50" rx="3" fill="#0f1e2e" stroke="#4cc9f0" stroke-opacity="0.4"/><text x="202.0" y="386" class="label">LIVE</text><text x="202.0" y="404" class="mono" font-size="11.5" fill="#8aa0b4">shipped</text><circle class="beat" cx="164.0" cy="382" r="4" fill="#4ade80"/><rect x="16" y="434" width="199.3" height="24" rx="3" fill="#0f1e2e" stroke="#4ade80" stroke-opacity="0.8"/><text x="26" y="449.8" class="mono" font-size="10.5" fill="#4ade80">ONE RULEBOOK FOR EVERY AGENT</text><rect x="16" y="464" width="218.6" height="24" rx="3" fill="#0f1e2e" stroke="#4ade80" stroke-opacity="0.8"/><text x="26" y="479.8" class="mono" font-size="10.5" fill="#4ade80">HOOKS THAT BLOCK RISKY COMMANDS</text><rect x="16" y="494" width="218.6" height="24" rx="3" fill="#0f1e2e" stroke="#4ade80" stroke-opacity="0.8"/><text x="26" y="509.8" class="mono" font-size="10.5" fill="#4ade80">CUSTOM LINT RULES AS GUARDRAILS</text><rect x="16" y="524" width="237.8" height="24" rx="3" fill="#0f1e2e" stroke="#4ade80" stroke-opacity="0.8"/><text x="26" y="539.8" class="mono" font-size="10.5" fill="#4ade80">PROJECT SKILLS AND REVIEWER AGENTS</text><text x="16" y="570" class="label">FIG. 02 · AGENTS WORKING INSIDE GUARDRAILS</text></g>
</svg>
